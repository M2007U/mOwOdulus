<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trigOwOmetry</title>
    <link rel="stylesheet" href="styles.css" >
</head>
<body id="HTML_body" style="font-family:Calibri, Consolas, 'Gill Sans', 'Gill Sans MT', 'Trebuchet MS', sans-serif;">
    <div class="centerRow">
        <canvas id="kanvas" width="1200" height="800"></canvas>
    </div>
    <div style="height: 120px;"></div>
    <div class="centerRow">
        <div class="settingsBox" style="width:125px;height:150px;color:white;">
            <font style="font-size:25px;">toggles </font><br>
            <br>
            <input type="checkbox" id="field_checkBox_steps_Line" checked onchange="POwO_config()">Step Chords<br>
            <input type="checkbox" id="field_checkBox_snap" checked onchange="POwO_config()">Snapping<br>
        </div>
        <div class="settingsBox" style="width:250px;height:150px;color:white;">
            <font style="font-size:25px;">configs </font><br>
            <br>
            Modulus : <input type="number" id="field_textBox_Modulus" inputmode="numeric" pattern="[0-9]*" style="width:80px" value="11" onchange="POwO_config()" ><br>
            Mark Count : <input type="number" id="field_textBox_MarkCount" inputmode="numeric" pattern="[0-9]*" style="width:80px" value="11" onchange="POwO_config()"><br>
            Alt Radius : <input type="number" id="field_textBox_AltRadius" inputmode="numeric" style="width:80px" value="1" onchange="POwO_config()"><br>
            
        </div>





        
    </div>
    <script src="main.js"></script>
</body>
